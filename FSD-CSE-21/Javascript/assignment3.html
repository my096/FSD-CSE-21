<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Booking System</title>

    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            width: 600px;
            min-height: 600px;
            background-color: aqua;
            padding: 30px;
        }

        .heading {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .heading img {
            width: 100px;
            height: 100px;
            border-radius: 50px;
        }

        .user-info {
            width: 600px;
            height: 75px;
            background: #000;
            color: white;
            display: flex;
            align-items: center;
            padding-left: 20px;
            box-sizing: border-box;
        }

        .user-info h4 {
            margin: 0;
        }

        form {
            margin-top: 40px;
        }

        label {
            display: inline-block;
            width: 120px;
        }

        input,
        select {
            padding: 8px;
            width: 250px;
        }

        #buy {
            width: 100px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box">

            <div class="heading">
                <img src="download.png" alt="Bus">
                <h1>Bus Booking System</h1>
            </div>

            <div class="user-info">
                <h4>User Information</h4>
            </div>

            <form>

                <label for="name">NAME</label>
                <input type="text" placeholder="Enter your name" id="name">
                <br><br>

                <label for="age">Age</label>
                <input type="number" placeholder="Enter your age" id="age">
                <br><br>

                <label for="mob">Mobile No.</label>
                <input type="text" placeholder="Enter mobile no." id="mob">
                <br><br>

                <label for="aad">Aadhar No.</label>
                <input type="text" placeholder="Enter Aadhar no." id="aad">
                <br><br>

                <label for="cit">City</label>
                <input type="text" placeholder="Enter city" id="cit">
                <br><br>

                <label for="seat">Seats</label>
                <select id="seat">
                    <option value="">Select Seats</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
                <br><br>

                <input type="submit" value="Buy Now" id="buy">
            </form>
        </div>
    </div>
</body>
</html>
